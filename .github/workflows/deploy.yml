name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: "AIzaSyB3jXPVIskUmmmVDjRexBM0WFdVX4uy3ao"
          VITE_FIREBASE_AUTH_DOMAIN: "concesionario-54c3b.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "concesionario-54c3b"
          VITE_FIREBASE_STORAGE_BUCKET: "concesionario-54c3b.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "198063726464"
          VITE_FIREBASE_APP_ID: "1:198063726464:web:5ffa5f31c497c26a2cab65"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
